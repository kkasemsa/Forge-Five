# SPDX-License-Identifier: GPL-3.0-only
# Forge Five: build the firmware package and run the host tests on Linux x86-64,
# where the JieLi toolchain runs natively (no Docker, no Rosetta).
#   push / PR to main, or run by hand (Actions > Build > Run workflow)
# Artifact (a green run only): forge-five-<sha>: forge-five.fwsc, forge-five.bin, loader/ota.bin, SHA256SUMS, MANIFEST.txt,
# the licence texts (tools/ff_dist.sh); a failed run: forge-five-FAILED-<sha> with its logs. A green build of main or
# of a pull request: also the pre-release dev-main / dev-pr-<n> (its .fwsc, SHA256SUMS, MANIFEST.txt)
name: Build

on:
  push:
    branches: [main, clipper-base]
    tags: ['ff-*']
  pull_request:
    branches: [main, clipper-base]
  workflow_dispatch:

permissions:
  contents: write    # releases on an ff-* tag (ff-0.2), and the development pre-releases

env:
  JIELI_TOOLCHAIN: ${{ github.workspace }}/../jieli/toolchain
  AC79_SDK: ${{ github.workspace }}/../fw-AC79_AIoT_SDK
  SDK_TAG: AC79NN_SDK_V1.2.1_2023-12-13

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0      # (the brand check reads the commits pushed)
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Python packages
        run: |
          pip install 'Pillow>=10' 'fonttools>=4.40' mido
          # (the UI font raster needs Pillow's RAQM layout engine: fail here, not in the build)
          python -c 'import PIL.features as f; raise SystemExit(0 if f.check("raqm") else "Pillow: no RAQM")'

      # The JieLi toolchain (clang 4.0.1 for pi32v2) from JieLi's package server: cached after the first good run
      - name: Cache JieLi toolchain
        id: tc
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/../jieli
          key: jieli-toolchain-linux-v2    # (v2: fetched through the digest check)

      - name: Fetch JieLi toolchain
        if: steps.tc.outputs.cache-hit != 'true'
        run: |                             # (checked against the digest pinned in the script; a new archive stops here)
          sh tools/get_toolchain.sh "$GITHUB_WORKSPACE/../jieli"
          ls "$JIELI_TOOLCHAIN/pi32v2/bin/clang"

      # The AC79 SDK (Apache-2.0): the package uses three files of cpu/wl82/tools only
      - name: Cache AC79 SDK files
        id: sdk
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/../fw-AC79_AIoT_SDK
          key: ac79-sdk-${{ env.SDK_TAG }}-v1

      - name: Fetch AC79 SDK files
        if: steps.sdk.outputs.cache-hit != 'true'
        run: |
          set -e
          D="$AC79_SDK"
          if git clone --depth 1 --branch "$SDK_TAG" --filter=blob:none --sparse \
               https://gitee.com/Jieli-Tech/fw-AC79_AIoT_SDK.git "$D"; then
            git -C "$D" sparse-checkout set cpu/wl82/tools
          else
            echo "sparse clone failed: full shallow clone"
            rm -rf "$D"
            git clone --depth 1 --branch "$SDK_TAG" https://gitee.com/Jieli-Tech/fw-AC79_AIoT_SDK.git "$D"
          fi
          # keep only what the package needs (a small cache)
          mkdir -p /tmp/sdk-keep/cpu/wl82/tools/cfg
          cp "$D/cpu/wl82/tools/uboot.boot" "$D/cpu/wl82/tools/cfg_tool.bin" /tmp/sdk-keep/cpu/wl82/tools/
          cp "$D/cpu/wl82/tools/cfg/eq_cfg_hw.bin" /tmp/sdk-keep/cpu/wl82/tools/cfg/
          rm -rf "$D" && mv /tmp/sdk-keep "$D"
          find "$D" -type f

      - name: No brand names (spec v0.3 §7)      # the UI's strings, the docs, the editor, the commits pushed
        run: |
          case "$GITHUB_EVENT_NAME" in
            push) python3 tools/brand_check.py --commits "${{ github.event.before }}..${{ github.sha }}" ;;
            pull_request) python3 tools/brand_check.py --commits "origin/${{ github.base_ref }}..${{ github.sha }}" ;;
            *) python3 tools/brand_check.py ;;
          esac

      - name: Build
        run: |
          set -o pipefail
          case "$GITHUB_REF_NAME" in ff-*) REL="--release ${GITHUB_REF_NAME#ff-}" ;; *) REL="" ;; esac
          if ! sh build.sh $REL 2>&1 | tee build.log; then
            # (the errors as annotations right here: the log artifact is not always reachable)
            grep -niE "error|fail|undefined|traceback" build.log | head -12 | sed 's/^/::error title=build error::/'
            tail -25 build.log | sed 's/^/::error title=build.log tail::/'
            exit 1
          fi
          # (the memory budget as a notice: readable without the log)
          grep -o "image [0-9]* B; RAM .* of [0-9]*" build.log | sed 's/^/::notice title=Memory::/' || true

      - name: Host tests
        run: |
          set -o pipefail
          sh tests/run_tests.sh 2>&1 | tee build/test.log

      - name: Report build and test failures   # (as annotations: readable on the run page and through the API)
        if: failure()
        run: |
          [ -f build.log ] && python3 .github/scripts/build_failures.py build.log || true
          [ -f build/test.log ] && python3 .github/scripts/test_failures.py build/test.log || true

      # The installable firmware is published only after the build AND the host tests passed (a failed run keeps its
      # logs under another name, below). dist/ is what a release ships: the package, the app, the loader, checksums,
      # a manifest, the licence texts and the sample attribution (LICENSING.md: the package carries Apache-2.0 SDK
      # files and MIT-licensed code, so their texts travel with it).
      - name: Distribution
        run: sh tools/ff_dist.sh build/dist "${{ github.sha }}" "${{ github.ref_name }}" "${{ github.run_id }}" passed

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: forge-five-${{ github.sha }}
          path: build/dist/
          if-no-files-found: error

      # Every green build of main or of a pull request is also kept as a pre-release, replaced by the next one of the
      # same source: dev-main, dev-pr-<n>. Its .fwsc downloads straight from the release page (an artifact needs a
      # GitHub login and comes zipped), and the build's commit carries the whole source (GPL-3.0-only).
      - name: Development build (pre-release)
        if: github.event_name != 'workflow_dispatch' && !startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          if [ "${{ github.event_name }}" = pull_request ]; then
            T="dev-pr-${{ github.event.pull_request.number }}"; SHA="${{ github.event.pull_request.head.sha }}"
            WHAT="pull request #${{ github.event.pull_request.number }} (${{ github.head_ref }}, merged into main as CI builds it)"
          else
            T="dev-${GITHUB_REF_NAME//\//-}"; SHA="${{ github.sha }}"; WHAT="branch $GITHUB_REF_NAME"
          fi
          S="${SHA:0:7}"
          cp build/dist/forge-five.fwsc "build/forge-five-$S.fwsc"
          gh release delete "$T" --cleanup-tag -y 2>/dev/null || true
          gh release create "$T" "build/forge-five-$S.fwsc" build/dist/SHA256SUMS build/dist/MANIFEST.txt \
            --prerelease --target "${{ github.sha }}" --title "Forge Five development build: $WHAT, $S" \
            --notes "A development build of Forge Five, $WHAT at commit $SHA (built as ${{ github.sha }}, run ${{ github.run_id }}: the build and the host tests passed). Not a release: it has not been tried on an FM-1. Source: https://github.com/${{ github.repository }}/tree/${{ github.sha }} (GPL-3.0-only). Install at your own risk: python3 tools/fm1_install.py forge-five-$S.fwsc"

      - name: Upload logs of a failed run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: forge-five-FAILED-${{ github.sha }}
          path: |
            build.log
            build/test.log
          if-no-files-found: ignore

      - name: Upload UI renders
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-renders-${{ github.sha }}
          path: build/ui_new/
          if-no-files-found: ignore

      # A tag ff-X.Y: the release carries the package, the checksums, the distribution folder (licences, manifest)
      # and the whole source
      - name: Release
        if: startsWith(github.ref, 'refs/tags/ff-')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          V="${GITHUB_REF_NAME#ff-}"
          (cd build/dist && zip -qr "../forge-five-$V-dist.zip" .)
          tar --exclude=.git --exclude=build --exclude=build.log --transform "s,^\./,forge-five-$V/," \
              -czf "build/forge-five-$V-source.tar.gz" .
          cp build/dist/forge-five.fwsc "build/forge-five-$V.fwsc"
          gh release create "$GITHUB_REF_NAME" "build/forge-five-$V.fwsc" build/dist/SHA256SUMS build/dist/MANIFEST.txt \
            "build/forge-five-$V-dist.zip" "build/forge-five-$V-source.tar.gz" \
            --title "Forge Five FF $V" \
            --notes "Forge Five FF $V: a synthesizer firmware for the M-VAVE FM-1, five engines tuned each to one kind of music on two parts (layer or split), based on Clipper (isod89 / 3dSam), SLOOP and Felucca (Leo Kuroshita / Huegelton Instruments). Not affiliated with M-VAVE. GPL-3.0-only; the licence texts are in the dist zip, the whole source in the tarball. Install at your own risk: python3 tools/fm1_install.py forge-five-$V.fwsc"
